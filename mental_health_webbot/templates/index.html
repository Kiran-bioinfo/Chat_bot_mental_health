<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitra</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3e8ff; /* Light purple background */
            color: #333333;
        }
        .chat-box {
            scroll-behavior: smooth;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #8b5cf6; /* Purple */
            border-radius: 50%;
            margin: 0 2px;
            animation: pulse 1.5s infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-purple-50">
    <header class="bg-white shadow-md sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-2xl font-bold text-purple-600">Mitra</div>
            <div class="text-lg text-gray-700"> User name </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar (Optional) -->
        <aside class="w-64 bg-gray-50 p-4 border-r border-gray-200 hidden md:block">
            <nav class="mt-5 px-2 space-y-1">
                <!-- Main Navigation Links -->
                <a href="#" class="bg-gray-900 text-white group flex items-center px-2 py-2 text-base font-medium rounded-md">
                    Dashboard
                </a>
                <!-- Add more main navigation links as needed -->
            </nav>

            <div class="mt-8">
                <h3 class="px-3 text-xs font-semibold uppercase tracking-wider text-gray-500">Resources</h3>
                <div class="mt-1 space-y-1" role="group" aria-labelledby="resources-heading">
                    <a href="#" class="group flex items-center rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white">
                        Mental Health Hotlines
                    </a>
                    <a href="#" class="group flex items-center rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white">
                        Therapy Finder
                    </a>
                    <a href="#" class="group flex items-center rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white">
                        Self-help Guides
                    </a>
                    <!-- Add more resource links as needed -->
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col max-w-3xl mx-auto w-full px-4 sm:px-6 lg:px-8">
            <div class="flex-1 overflow-y-auto p-4" id="chat-panel">
                <div class="max-w-3xl mx-auto">
                    <div class="chat-box space-y-4" id="chat-box">
                        <div class="flex justify-start">
                            <div class="bg-purple-100 text-gray-800 p-3 rounded-lg max-w-xs lg:max-w-md shadow-md">
                                <p>Hi Mitra, How can I help you today?</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="bg-white p-4 border-t border-gray-200">
                <div class="max-w-3xl mx-auto flex items-center space-x-2">
                    <input type="text" id="user-input" placeholder="Ask anything…" class="flex-1 p-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <button id="send-button" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white p-3 rounded-full shadow-lg hover:from-purple-600 hover:to-pink-600 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                            <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.542 60.542 0 0018.445-8.986.75.75 0 000-1.218A60.542 60.542 0 003.478 2.405z" />
                        </svg>
                    </button>
                </div>
                <div id="options-container" class="flex flex-wrap justify-center gap-2 mt-2 hidden"></div>
                </div>

            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
